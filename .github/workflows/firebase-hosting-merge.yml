# Deploy frontend and an OSM snapshot with data served from Firebase Hosting.
# The website NEVER calls Overpass directly from the browser.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Refresh OpenStreetMap data every Monday at 04:20 UTC.
    - cron: "20 4 * * 1"

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate local park and cafe dataset (server side)
        run: node scripts/refresh-osm.mjs
      - name: Deploy frontend and dataset to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUINTOYPARQUE }}
          channelId: live
          projectId: quintoyparque
