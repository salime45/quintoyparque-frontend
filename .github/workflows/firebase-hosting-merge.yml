# Publica exclusivamente los archivos versionados en el repositorio.
# El catálogo de OpenStreetMap se actualiza en refresh-osm.yml.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed OSM catalogue
        run: |
          node -e '
          const fs = require("fs");
          const x = JSON.parse(fs.readFileSync("public/data/osm-places.json", "utf8"));
          if (x.schemaVersion !== 1 || x.license !== "ODbL" ||
              !x.coverage || !Array.isArray(x.elements) || x.elements.length < 200) {
            throw new Error("Falta el catálogo OSM válido en GitHub");
          }
          console.log("Publicando", x.elements.length, "ubicaciones desde el repositorio");
          '
      - name: Deploy versioned frontend to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUINTOYPARQUE }}
          channelId: live
          projectId: quintoyparque
