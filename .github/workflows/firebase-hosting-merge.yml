# Publicar reglas de Firestore antes del Hosting en cada cambio de main.
name: Deploy Firebase Hosting and Firestore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-live
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-live
        with:
          firebase_service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUINTOYPARQUE }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
