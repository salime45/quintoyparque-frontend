# Piloto geográfico en qyp-test; la importación utiliza únicamente osmCatalogTest.
name: Deploy develop to qyp-test

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-qyp-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test local OSM parser with small fixtures
        run: npm run catalog:es:setup && npm run test:osm
      - name: Test frontend
        run: npm test
      - name: Test Firestore rules with local emulator
        run: npm run test:firestore
      - name: Build Vue frontend
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile explorer
        run: npm run test:e2e
      - name: Test geoqueries with Firestore emulator and browsers
        run: npm run test:geo
      - name: Build test site with geographic catalogue
        run: npm run build:geo
      - name: Authenticate Firebase CLI
        uses: google-github-actions/auth@v3
        with:
          project_id: quintoyparque
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUINTOYPARQUE }}
      - name: Publish rules including the read-only test catalogue
        run: npx --no-install firebase deploy --project quintoyparque --config firebase.test.json --only firestore:rules --non-interactive
      - name: Deploy Hosting to qyp-test
        run: npx --no-install firebase deploy --project quintoyparque --config firebase.test.json --only hosting:test --non-interactive
