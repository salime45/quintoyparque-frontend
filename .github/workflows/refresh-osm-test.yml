name: Refresh geographic test catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "50 5 * * 1"

permissions:
  contents: read

# No se solapa con la importación del despliegue de develop.
concurrency:
  group: firebase-qyp-test
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: Download complete Valencia snapshot
        env:
          OSM_REQUIRE_REFRESH: "true"
        run: node scripts/refresh-osm.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: quintoyparque
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUINTOYPARQUE }}
      - name: Synchronize test catalogue only
        run: npm run catalog:sync:test
