name: Deploy Firebase Hosting and Firestore rules
description: Test the app and Firestore rules, publish rules first, then Firebase Hosting.
inputs:
  firebase_service_account:
    description: JSON for the existing Firebase Hosting deploy service account
    required: true
  github_token:
    description: GitHub token for Firebase Hosting deploy action
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
    - name: Install pinned Firebase tools and rule test dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Test local OSM parser with small fixtures
      shell: bash
      run: npm run catalog:es:setup && npm run test:osm
    - name: Run frontend tests
      shell: bash
      run: npm test
    - name: Test Firestore security rules with local emulator
      shell: bash
      run: npm run test:firestore
    - name: Validate versioned OpenStreetMap catalogue
      shell: bash
      run: |
        node - <<'NODE'
        const fs=require('node:fs');
        const data=JSON.parse(fs.readFileSync('public/data/osm-places.json','utf8'));
        if(data.schemaVersion!==2 || data.license!=='ODbL' || !data.coverage ||
          !Array.isArray(data.elements)||data.elements.length<200 ||
          !Number.isInteger(data.parkAreaCount)||data.parkAreaCount<50 ||
          !Array.isArray(data.parkMatches)||data.parkMatches.length<1)
          throw Error('Catálogo OpenStreetMap incompleto');
        console.log('OK: '+data.elements.length+' ubicaciones, '+
          data.parkAreaCount+' zonas delimitadas y '+data.parkMatches.length+
          ' parejas detectadas dentro del mismo parque');
        NODE
    - name: Build Vue frontend
      shell: bash
      run: npm run build
    - name: Install Chromium for browser tests
      shell: bash
      run: npx playwright install --with-deps chromium
    - name: Test desktop and mobile explorer
      shell: bash
      run: npm run test:e2e
    - name: Authenticate Firebase CLI for Firestore rules
      uses: google-github-actions/auth@v3
      with:
        project_id: quintoyparque
        credentials_json: ${{ inputs.firebase_service_account }}
    - name: Deploy Firestore rules first
      shell: bash
      run: npx --no-install firebase deploy --project quintoyparque --only firestore:rules --non-interactive
    - name: Deploy Firebase Hosting only after rules succeed
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ inputs.github_token }}
        firebaseServiceAccount: ${{ inputs.firebase_service_account }}
        channelId: live
        projectId: quintoyparque
